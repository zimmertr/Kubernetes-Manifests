name: Manifest PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: manifest-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate every change to main. Argo CD syncs this repo automatically, so an
  # unrenderable kustomization or a malformed YAML reaches the cluster as a
  # failed sync rather than a failed build. This job is what makes the
  # automated bump PRs (bluebird image tag, bluebird-helm chart versions) worth
  # routing through a PR at all: `gh pr merge --auto` has something to wait on.
  #
  # argocd-diff-preview renders the PR's apps with Argo CD itself, in a
  # throwaway kind cluster on the runner, and posts the rendered diff against
  # main. It renders the way the cluster does (ApplicationSets, Helm through
  # kustomize, the same Argo CD), so nothing here pins helm or kustomize. The
  # watch-pattern annotations on each ApplicationSet keep it to the apps whose
  # folder the PR touches. It never talks to the real cluster.
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read both branches
      pull-requests: write # post the diff as a sticky comment
    env:
      # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
      DIFF_PREVIEW_IMAGE: v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull-request
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Render the changed apps with Argo CD
        env:
          TARGET_BRANCH: refs/pull/${{ github.event.number }}/merge
          REPO: ${{ github.repository }}
        run: |
          # The throwaway Argo CD is the chart version argo/argo-cd pins in
          # this PR, with the one setting every app here needs from
          # argo/argo-cd/values.yml: kustomize's helmCharts need --enable-helm.
          ARGOCD_CHART_VERSION=$(yq '.helmCharts[0].version' pull-request/argo/argo-cd/kustomization.yml)
          export ARGOCD_CHART_VERSION
          mkdir argocd-config
          printf 'configs:\n  cm:\n    kustomize.buildOptions: "--enable-helm"\n' > argocd-config/values.yaml
          # 60000 leaves room under GitHub's 65536-character comment limit for
          # the sticky comment's own marker.
          docker run --rm --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/main:/base-branch" \
            -v "$PWD/pull-request:/target-branch" \
            -v "$PWD/output:/output" \
            -v "$PWD/argocd-config:/argocd-config" \
            -e TARGET_BRANCH -e REPO -e ARGOCD_CHART_VERSION \
            -e MAX_DIFF_LENGTH=60000 -e TIMEOUT=300 \
            "dagandersen/argocd-diff-preview:${DIFF_PREVIEW_IMAGE}"

      - name: Post the diff
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: argocd-diff-preview
          path: output/diff.md
