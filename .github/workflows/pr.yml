name: Manifest PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: manifest-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate every change to main. Argo CD syncs this repo automatically, so an
  # unrenderable kustomization or a malformed YAML reaches the cluster as a
  # failed sync rather than a failed build. This job is what makes the
  # automated bump PRs (bluebird image tag, bluebird-helm chart versions) worth
  # routing through a PR at all: `gh pr merge --auto` has something to wait on.
  # For the prod chart bump it is also the review gate — see the render-diff
  # step at the end of this job.
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the merge base to diff against

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Install kustomize
        env:
          # There's no setup-kustomize action pinned here, so the version lives in
          # an env var with the annotation Renovate's customManager looks for.
          # Without it a hand-rolled download URL is invisible to Renovate and the
          # pin rots silently — this sat at 5.7.1 while upstream reached 5.8.1.
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
          KUSTOMIZE_VERSION: 5.8.1
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          kustomize version

      - name: Collect changed files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --diff-filter=d drops deletions: a removed file has nothing to parse,
          # and its directory is picked up anyway if a sibling still changed.
          git diff --name-only --diff-filter=d "$BASE" "$HEAD" > changed.txt
          echo "Changed files:"; sed 's/^/  /' changed.txt

      - name: Parse changed YAML
        run: |
          pip install --quiet pyyaml
          # Cheap first gate, and the one that catches the failure mode the bump
          # bots can actually cause: they rewrite version lines with targeted
          # `sed`, and a regex that matches more than intended corrupts the file.
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = []
          for line in pathlib.Path("changed.txt").read_text().splitlines():
              if not line.endswith((".yml", ".yaml")):
                  continue
              try:
                  list(yaml.safe_load_all(pathlib.Path(line).read_text()))
                  print(f"  ok  {line}")
              except yaml.YAMLError as e:
                  bad.append(line)
                  print(f"  FAIL {line}\n{e}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      - name: Render affected kustomizations
        run: |
          # Walk each changed file up to its nearest kustomization, so a PR that
          # touches one app renders one app. Rendering the whole repo would pull
          # every upstream chart on every PR — slow, and red for reasons that
          # have nothing to do with the change under review.
          #
          # `.disable*` and deprecated/ are excluded for the same reason Argo's
          # root Application excludes them: nothing there is deployed, and some
          # of it no longer renders.
          targets=""
          while read -r file; do
            case "$file" in
              deprecated/*|*.disable*/*) continue ;;
            esac
            dir="$(dirname "$file")"
            while [ "$dir" != "." ]; do
              if [ -f "$dir/kustomization.yml" ] || [ -f "$dir/kustomization.yaml" ]; then
                targets="$(printf '%s\n%s' "$targets" "$dir")"
                break
              fi
              dir="$(dirname "$dir")"
            done
          done < changed.txt

          # This workflow is the only thing standing between a bad manifest and a
          # failed Argo sync, and Renovate keeps bumping the tools it runs. A PR
          # that only edits this file has no kustomization ancestor, so it would
          # otherwise pass on an empty target list — green without rendering
          # anything, which is exactly how a broken helm/kustomize bump would land.
          # Render one real app so the check has to prove it still works.
          if grep -q '^\.github/workflows/pr\.yml$' changed.txt; then
            echo "Workflow changed — adding public/bluebird as a canary target."
            targets="$(printf '%s\n%s' "$targets" "public/bluebird")"
          fi

          targets="$(printf '%s' "$targets" | grep -v '^$' | sort -u || true)"
          if [ -z "$targets" ]; then
            echo "No kustomization affected by this PR."
            exit 0
          fi

          rc=0
          for t in $targets; do
            echo "::group::kustomize build $t"
            # --enable-helm inflates helmCharts blocks; the charts these pull are
            # public, so no registry credentials are involved.
            if kustomize build --enable-helm "$t" >/dev/null; then
              echo "::endgroup::"; echo "  ok   $t"
            else
              echo "::endgroup::"; echo "  FAIL $t"; rc=1
            fi
          done
          exit $rc

      # The one bump PR that must not always self-merge: a chart change can
      # render fine yet still change prod (helm silently ignores values the
      # chart stopped reading). A render diff vs origin/main (what Argo runs)
      # fails this required check and with it the armed auto-merge. The branch
      # guard exists because every other PR is supposed to change the render.
      # Labels are stripped by yq path, not grep, so a version label leaking
      # into matchLabels still surfaces and holds.
      - name: Gate stable chart bumps on an inert render
        if: github.head_ref == 'chore/bluebird-stable-chart'
        run: |
          strip() { yq e 'del(.metadata.labels."helm.sh/chart", .metadata.labels."app.kubernetes.io/version")' -; }
          kustomize build --enable-helm public/bluebird | strip > /tmp/head.yaml
          git worktree add -q /tmp/deployed origin/main
          kustomize build --enable-helm /tmp/deployed/public/bluebird | strip > /tmp/deployed.yaml
          if diff -u /tmp/deployed.yaml /tmp/head.yaml > /tmp/render.diff; then
            echo "Rendered prod manifests unchanged (version labels aside) — inert, safe to self-merge."
            exit 0
          fi
          echo '::group::rendered prod diff (deployed -> this PR)'
          cat /tmp/render.diff
          echo '::endgroup::'
          echo "::error::This chart bump changes prod's rendered manifests, so it is held: the failing check blocks any merge of this PR (required checks bind admins here too). Review the diff in the step log, then ship the same version bump in a normal PR together with whatever values.yml change it needs — human branches skip this gate — and close this one. Don't push fixes to this branch: releases force-push over it."
          exit 1
