name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows, and Semgrep's rule that a tagged Dockerfile FROM carries a digest
# (this repo has no Dockerfile, so that job scans nothing).
#
# Branch protection requires `Lint / actionlint`, `Lint / zizmor` and
# `Lint / semgrep` (this job's name, then the module's); renaming either
# strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@2a34859a708731c9493f8676580e61d0ee5ea73d # v0.10.1
    permissions:
      contents: read
