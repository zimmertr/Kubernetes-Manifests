apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: public
  namespace: argo-system
spec:
  generators:
    - git:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        revision: main
        directories:
          - path: "public/*"
          - exclude: true
            path: "public/*.disable*"
          # bluebird-pr ships its own ApplicationSet + AppProject (applied by the
          # root generators). Exclude it so this fan-out doesn't also wrap it as a
          # plain Application under the `public` project.
          - exclude: true
            path: "public/bluebird-pr"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{ path.basenameNormalized }}"
      labels:
        app-group: public
    spec:
      project: public
      source:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        targetRevision: main
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: "enabled"
      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[] | select(.name | endswith("-stable")) | .route[].weight
