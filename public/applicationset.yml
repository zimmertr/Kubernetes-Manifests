apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: public
  namespace: argo-system
  annotations:
    # argocd-diff-preview (pr.yml) renders this set only when a file under
    # public/ changes, and each app only when a file under its own path does.
    argocd-diff-preview/watch-pattern: "public/.*"
spec:
  generators:
    - git:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        revision: main
        directories:
          - path: "public/*"
          - exclude: true
            path: "public/*.disable*"
          # Owns its own ApplicationSet + AppProject (applied by the root generators).
          - exclude: true
            path: "public/bluebird-pr"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      annotations:
        argocd-diff-preview/watch-pattern: "{{ path }}/.*"
      name: "{{ path.basenameNormalized }}"
      labels:
        app-group: public
    spec:
      project: public
      source:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        targetRevision: main
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: "enabled"
      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            # Every route the Rollouts controller weights: the SPA, and the
            # two API routes bluebird names in trafficRouting. A weighted
            # route missing here is one selfHeal reverts mid-rollout.
            - .spec.http[] | select(.name | test("-(stable|api-public|api-keyed)$")) | .route[].weight
