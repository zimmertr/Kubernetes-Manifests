# The API gate on a canary. One discovery against the canary proves the build
# serves its API and finds places in a known ring. The answer is bluebird's
# DestinationsResponse, and the gate passes on one peak or more.
#
# It asks for discovery because the places table answers that with no third
# party (bluebird#760): one request to production with this body answered 200
# with 8 peaks in 0.27 s (2026-10-27). Overpass is the app's fallback when the
# table cannot answer, which is what the 120 s timeout is for. Open-Meteo stays
# off the gate's path. A full analyze here spent the free daily quota the
# cluster shares with every browser on the home network, and on a busy day the
# pod answered 429 and failed healthy releases (bluebird#787, TJ 2026-10-27).
# Forecast correctness is CI's: pytest and the Playwright suite run against the
# built image.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-test
spec:
  metrics:
    - name: api-test
      count: 1
      failureLimit: 0
      successCondition: len(result.destinations) >= 1
      provider:
        web:
          method: POST
          url: http://bluebird-canary.bluebird-system.svc.cluster.local:8000/api/destinations
          timeoutSeconds: 120
          jsonBody:
            destination_types: [peak]
            polygon:
              type: Polygon
              coordinates:
                # Tiger Mountain, Issaquah Washington
                - - [-122.03, 47.44]
                  - [-121.91, 47.44]
                  - [-121.91, 47.53]
                  - [-122.03, 47.53]
                  - [-122.03, 47.44]
