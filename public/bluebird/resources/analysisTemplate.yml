# The experiment gate: full-path functional smoke test against the new
# version before any user traffic shifts. The job curls through the real
# ingress (gateway Service + public hostname + TLS) with the experiment
# header, which the VirtualService routes to the experiment pods.
# 3 measurements, one flake forgiven — two failures abort the release, so an
# extended Overpass/Open-Meteo outage blocks deploys rather than skipping
# validation.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluebird-api-test
spec:
  args:
    - name: host
      value: bluebirdforecast.com
    - name: gateway
      value: gateway.istio-gateway.svc.cluster.local:443
    - name: header
      value: "experiment: true"
  metrics:
    - name: api-test
      count: 3
      interval: 30s
      failureLimit: 1
      provider:
        job:
          spec:
            # Retries are governed by count/failureLimit above; a pod-level
            # retry would just hide a failed measurement.
            backoffLimit: 0
            template:
              metadata:
                annotations:
                  # Sidecar'd Jobs never complete; the script reaches the
                  # gateway Service directly instead of through the mesh.
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                containers:
                  - name: api-test
                    image: curlimages/curl:latest
                    command: ["/bin/sh", "/scripts/api-test.sh"]
                    env:
                      - name: HOST
                        value: "{{ args.host }}"
                      - name: CONNECT_TO
                        value: "{{ args.gateway }}"
                      - name: HEADER
                        value: "{{ args.header }}"
                    volumeMounts:
                      - name: api-test-sh
                        mountPath: /scripts
                volumes:
                  - name: api-test-sh
                    configMap:
                      name: api-test-sh
---
# The background tripwire: while the rollout shifts traffic, the Rollouts
# controller itself polls the canary Service (web provider — no Job pods)
# and aborts the moment the new version stops responding. It deliberately
# targets the Service, not the gateway path: the gate above already proved
# the ingress path, and a probe with no other components in it can only
# fail when the canary itself is bad — exactly when rollback is the right
# response. /openapi.json is served by the app itself and is stable JSON.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluebird-health
spec:
  metrics:
    - name: canary-responding
      interval: 15s
      # Grace for canary pods still pulling/starting when the first
      # setWeight step begins.
      initialDelay: 30s
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: result == 'Bluebird'
      provider:
        web:
          url: http://bluebird-canary.bluebird-system.svc.cluster.local:8000/openapi.json
          jsonPath: "{$.info.title}"
          timeoutSeconds: 10
