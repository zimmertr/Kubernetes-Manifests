# Identity gate: is the release behind the canary route the one we meant, and did
# it wire itself up? Curls through the real ingress with the `experiment: true`
# header, so a VirtualService header-routing misfire fails here rather than
# silently validating the stable pods (which api-test below cannot detect).
#
# count 1 / failureLimit 0 is safe because the preceding setCanaryScale step
# does not complete until the canary reports Available, so there is no startup
# race to sample around.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluebird-version-check
spec:
  args:
    - name: host
      value: bluebirdforecast.com
    - name: gateway
      value: gateway.istio-gateway.svc.cluster.local:443
    - name: header
      value: "experiment: true"
    # Empty = assert only that the version is semver-shaped. Set it to the
    # release being rolled out to also prove the header reached the new pods.
    - name: expected-version
      value: ""
  metrics:
    - name: version-check
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            # Do not add ttlSecondsAfterFinished: it deletes the pod holding the
            # failure output. The AnalysisRun owns this Job, so the Rollout's
            # unsuccessfulRunHistoryLimit already governs retention.
            template:
              metadata:
                annotations:
                  # Sidecar'd Jobs never complete; the script reaches the
                  # gateway Service directly instead of through the mesh.
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                containers:
                  - name: version-check
                    image: curlimages/curl:latest
                    command: ["/bin/sh", "/scripts/version-check.sh"]
                    env:
                      - name: HOST
                        value: "{{ args.host }}"
                      - name: CONNECT_TO
                        value: "{{ args.gateway }}"
                      - name: HEADER
                        value: "{{ args.header }}"
                      - name: EXPECTED_VERSION
                        value: "{{ args.expected-version }}"
                    volumeMounts:
                      - name: canary-scripts
                        mountPath: /scripts
                volumes:
                  - name: canary-scripts
                    configMap:
                      name: canary-scripts
---
# Functional gate: a real /api/analyze over a known polygon, exercising Overpass
# and Open-Meteo end to end. Blocking, because a release that cannot serve an
# analysis is not healthy whatever the reason.
#
# Asked once. Catching an unstable canary over time is bluebird-health's job
# below; this answers a different question, and repeating it would only hammer
# free upstreams for an answer the first attempt already gave.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluebird-api-test
spec:
  args:
    - name: host
      value: bluebirdforecast.com
    - name: gateway
      value: gateway.istio-gateway.svc.cluster.local:443
    - name: header
      value: "experiment: true"
  metrics:
    - name: api-test
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            # No retries: one would hide the failure this gate exists to catch.
            backoffLimit: 0
            # Do not add ttlSecondsAfterFinished; see the identity gate above.
            template:
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                containers:
                  - name: api-test
                    image: curlimages/curl:latest
                    command: ["/bin/sh", "/scripts/api-test.sh"]
                    env:
                      - name: HOST
                        value: "{{ args.host }}"
                      - name: CONNECT_TO
                        value: "{{ args.gateway }}"
                      - name: HEADER
                        value: "{{ args.header }}"
                    volumeMounts:
                      - name: canary-scripts
                        mountPath: /scripts
                volumes:
                  - name: canary-scripts
                    configMap:
                      name: canary-scripts
---
# Background tripwire: the controller polls the canary across the whole traffic
# shift and aborts the moment it stops answering. Targets the Service rather
# than the gateway path deliberately, so nothing but the canary itself can fail
# it, which is exactly when rollback is right.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluebird-health
spec:
  metrics:
    - name: canary-responding
      interval: 15s
      # Short: the canary is Ready and twice-validated before this starts, and
      # a long delay just spends the first soak window not looking.
      initialDelay: 10s
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: result != '' && result != 'dev'
      provider:
        web:
          url: http://bluebird-canary.bluebird-system.svc.cluster.local:8000/api/version
          jsonPath: "{$.version}"
          timeoutSeconds: 10
