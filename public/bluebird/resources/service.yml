apiVersion: v1
kind: Service
metadata:
  name: bluebird-stable
spec:
  selector:
    app: bluebird
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: bluebird-canary
spec:
  selector:
    app: bluebird
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
