apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: version-check
spec:
  args:
    - name: host
      value: bluebirdforecast.com
    - name: gateway
      value: gateway.istio-gateway.svc.cluster.local:443
    - name: header
      value: "experiment: true"
    # Empty = assert only that the version is semver-shaped. Set it to the
    # release being rolled out to also prove the header reached the new pods.
    - name: expected-version
      value: ""
  metrics:
    - name: version-check
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            # Do not add ttlSecondsAfterFinished: it deletes the pod holding the
            # failure output. The AnalysisRun owns this Job, so the Rollout's
            # unsuccessfulRunHistoryLimit already governs retention.
            template:
              metadata:
                annotations:
                  # Sidecar'd Jobs never complete; the script reaches the
                  # gateway Service directly instead of through the mesh.
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                containers:
                  - name: version-check
                    image: curlimages/curl:latest
                    command: ["/bin/sh", "/scripts/version-check.sh"]
                    env:
                      - name: HOST
                        value: "{{ args.host }}"
                      - name: CONNECT_TO
                        value: "{{ args.gateway }}"
                      - name: HEADER
                        value: "{{ args.header }}"
                      - name: EXPECTED_VERSION
                        value: "{{ args.expected-version }}"
                    volumeMounts:
                      - name: canary-scripts
                        mountPath: /scripts
                volumes:
                  - name: canary-scripts
                    configMap:
                      name: canary-scripts
