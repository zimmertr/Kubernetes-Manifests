apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: version-check
spec:
  args:
    - name: version
  metrics:
    - name: version-check
      # The canary Service keeps the stable pod hash for about a second after
      # the controller creates the canary pod, so a probe fired at once reads
      # the stable version and aborts the rollout on a race, not a defect.
      # Measured on bluebird v0.79.12, v0.82.2 and v0.82.5. The delay gives the
      # selector time to move before the one measurement is taken.
      initialDelay: 15s
      count: 1
      failureLimit: 0
      # The image reads name:tag@digest, so the version sits between the
      # colon and the @. Both ends, so 0.1.2 doesn't match 0.1.23.
      successCondition: '"{{args.version}}" contains (":" + result + "@")'
      provider:
        web:
          url: http://bluebird-canary.bluebird-system.svc.cluster.local:8000/api/version
          jsonPath: "{$.version}"
          timeoutSeconds: 10
