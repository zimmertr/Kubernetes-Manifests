# A static volume rather than a dynamic one, so the database behind
# bluebird#760's shared cache outlives its pod and the cluster: its places
# table is filled from a 95 GB planet download. Pre-bound to the claim
# CloudNativePG creates for the cluster's first instance, because the operator
# names its own claims and cannot be pointed at a volume.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bluebird-database-data
  annotations:
    # Before the Cluster, which waits on this volume.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  claimRef:
    namespace: bluebird-system
    name: bluebird-database-1
  csi:
    driver: csi.proxmox.sinextra.dev
    fsType: xfs
    volumeAttributes:
      cache: writethrough
      ssd: "true"
      storage: FlashPool
    volumeHandle: sol-milkyway/earth/FlashPool/vm-9999-Bluebird-Data
  mountOptions:
    - noatime
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/region
          operator: In
          values:
            - sol-milkyway
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - earth
  persistentVolumeReclaimPolicy: Retain
  storageClassName: proxmox-flashpool
