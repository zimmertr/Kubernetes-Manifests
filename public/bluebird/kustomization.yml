namespace: bluebird-system

helmCharts:
- name: bluebird-helm
  namespace: bluebird-system
  releaseName: bluebird
  repo: oci://registry-1.docker.io/zimmertr
  valuesFile: values.yml
  version: 0.4.11

resources:
- resources/namespace.yml
- resources/analysisTemplate-apiTest.yml
- resources/analysisTemplate-versionCheck.yml

configMapGenerator:
- files:
  - files/version-check.sh
  - files/api-test.sh
  name: canary-scripts
  namespace: bluebird-system

generatorOptions:
  disableNameSuffixHash: true

images:
- name: zimmertr/bluebird
  newName: zimmertr/bluebird
  newTag: 0.29.6
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
