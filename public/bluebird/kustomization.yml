namespace: bluebird-system

helmCharts:
- name: bluebird-helm
  namespace: bluebird-system
  releaseName: bluebird
  repo: oci://registry-1.docker.io/zimmertr
  valuesFile: values.yml
  version: 0.4.11

resources:
- resources/namespace.yml
- resources/analysisTemplate.yml

# Without this, blowing the progress deadline marks the Rollout Degraded but
# never rolls back, parking the service at the reduced capacity dynamicStableScale
# left it at. Patched rather than set in values.yml because it is a Rollout spec
# field and the chart only renders spec.strategy.canary verbatim.
patches:
- target:
    kind: Rollout
    name: bluebird
  patch: |-
    - op: add
      path: /spec/progressDeadlineAbort
      value: true

configMapGenerator:
- files:
  - files/version-check.sh
  - files/api-test.sh
  name: canary-scripts
  namespace: bluebird-system

generatorOptions:
  disableNameSuffixHash: true

images:
- name: zimmertr/bluebird
  newName: zimmertr/bluebird
  newTag: 0.29.6
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
