namespace: bluebird-system

helmCharts:
- name: bluebird-helm
  namespace: bluebird-system
  releaseName: bluebird
  repo: oci://registry-1.docker.io/zimmertr
  valuesFile: values.yml
  version: 0.16.34
  # The database subchart ships a ping Job as a Helm test hook, which Argo CD
  # would run as an ordinary Job on every sync.
  skipTests: true
# The CloudNativePG operator, which runs the database the chart above deploys
# (bluebird#760). Its own entry rather than part of the chart, because its
# CRDs and webhooks are cluster-wide and installed once. Its pods take the
# namespace's Istio sidecar like the rest: the mesh runs native sidecars, so
# the database's init Job still completes, and mTLS is permissive, so the API
# server still reaches the operator's webhook without one. A STRICT
# PeerAuthentication would need an exception for that webhook.
- name: cloudnative-pg
  namespace: bluebird-system
  releaseName: cnpg
  repo: https://cloudnative-pg.github.io/charts
  version: 0.29.1

resources:
- resources/namespace.yml
- resources/persistentVolume.yml
- resources/analysisTemplate-apiTest.yml
- resources/analysisTemplate-errorRate.yml
- resources/analysisTemplate-versionCheck.yml

# Argo CD syncs the operator and the database's volume first (wave -2), the
# database next (-1, in values.yml), then the app (0): the Cluster needs the
# operator's CRDs and webhook, and the app's pods read the Secret the operator
# writes for the Cluster.
patches:
- target:
    labelSelector: app.kubernetes.io/name=cloudnative-pg
  patch: |-
    apiVersion: v1
    kind: Any
    metadata:
      name: any
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
# The CRDs carry no labels. They are also larger than the 256 KiB a
# client-side apply can record in its annotation, so Argo CD applies them
# server-side.
- target:
    group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: .*\.cnpg\.io
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: any
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
        argocd.argoproj.io/sync-options: ServerSideApply=true

images:
- name: zimmertr/bluebird
  newName: zimmertr/bluebird
  newTag: 0.116.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
