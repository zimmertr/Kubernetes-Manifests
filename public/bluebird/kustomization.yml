namespace: bluebird-system

# Inflate the Bluebird workload/service/istio resources from the published OCI
# Helm chart. Requires Argo CD's kustomize to run with `--enable-helm`.
helmCharts:
- name: bluebird-helm
  repo: oci://registry-1.docker.io/zimmertr
  version: 0.1.1
  releaseName: bluebird
  namespace: bluebird-system
  valuesFile: values.yml

# The namespace (istio-injection + PSA labels) and the rollout AnalysisTemplate
# stay in the manifests — they are environment concerns, not part of the chart.
resources:
- resources/namespace.yml
- resources/analysisTemplate.yml

configMapGenerator:
- files:
  - files/test-connection.sh
  name: test-connection-sh
  namespace: bluebird-system

generatorOptions:
  disableNameSuffixHash: true

# Owns the running image tag; bumped by the app repo's release.yml via
# `kustomize edit set image`. Overrides the chart's default `latest`.
images:
- name: zimmertr/bluebird
  newName: zimmertr/bluebird
  newTag: 0.3.2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
