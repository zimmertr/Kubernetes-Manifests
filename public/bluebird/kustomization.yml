namespace: bluebird-system
# The database subchart ships a ping Job as a Helm test hook, which Argo CD
# would run as an ordinary Job on every sync.
helmCharts:
  - name: bluebird-helm
    namespace: bluebird-system
    releaseName: bluebird
    repo: oci://ghcr.io/zimmertr
    skipTests: true
    valuesFile: values.yml
    version: 0.18.55
resources:
  - resources/namespace.yml
  - resources/analysisTemplate-apiTest.yml
  - resources/analysisTemplate-errorRate.yml
  - resources/analysisTemplate-versionCheck.yml
images:
  # Named for the image the chart renders. bluebird's release writes the tag
  # and the digest the release scanned (zimmertr/bluebird record 0280).
  - name: ghcr.io/zimmertr/bluebird
    newTag: 0.134.10
    digest: sha256:eb225707fc0080189a5a8401cb5aa966efe7c855a2689f36143b60816fac75ec
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
