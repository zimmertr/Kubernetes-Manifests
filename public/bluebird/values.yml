replicas: 3

revisionHistoryLimit: 1
analysis:
  successfulRunHistoryLimit: 1
  unsuccessfulRunHistoryLimit: 2

extraEnv:
  - name: LOG_LEVEL
    value: INFO

useRollout: true
strategy: Canary
canary:
  # Required by the setCanaryScale step below: without a traffic router Argo
  # derives the canary's traffic share from its replica count, which is the
  # dial setCanaryScale overrides, so the controller rejects the whole spec
  # (InvalidSpec, Rollout never progresses). It is also the only thing that
  # ever moves the weights on the chart's bluebird-stable route.
  trafficRouting:
    istio:
      virtualService:
        name: bluebird
        routes:
          - bluebird-stable
  steps:
    - setCanaryScale:
        replicas: 1
    # Validate that the canary is running the expected version of Bluebird
    - analysis:
        templates:
          - templateName: version-check
        args:
          - name: version
            valueFrom:
              fieldRef:
                fieldPath: spec.template.spec.containers[0].image
    # Validate that the canary API is responding successfully
    - analysis:
        templates:
          - templateName: api-test

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true
