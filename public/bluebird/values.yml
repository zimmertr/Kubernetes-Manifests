replicas: 3
# Rollout artifact retention: keep only current + 1 previous ReplicaSet, and
# completed AnalysisRuns/Experiments per outcome (successful/failed). Reduces
# Argo CD UI clutter without affecting deployment stability or observability.
revisionHistoryLimit: 1
analysis:
  successfulRunHistoryLimit: 1
  unsuccessfulRunHistoryLimit: 2
extraEnv:
  - name: LOG_LEVEL
    value: INFO
# Kubelet probes hit the dedicated /healthz target, which the app access-logs
# at TRACE only — so probe heartbeats stay out of the INFO logs while real
# user requests to / keep logging. Requires a bluebird image that serves
# /healthz (added in bluebird#55); older images 404 it and would fail probes.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
  readiness:
    httpGet:
      path: /healthz
      port: 8000
  startup:
    httpGet:
      path: /healthz
      port: 8000
strategy: Canary
canary:
  dynamicStableScale: true
  trafficRouting:
    istio:
      virtualService:
        name: bluebird
        routes:
          - bluebird-stable
  # Continuous tripwire: the controller polls the canary Service from the
  # first traffic step until completion and aborts the rollout (auto
  # rollback) if the new version stops responding.
  analysis:
    templates:
      - templateName: bluebird-health
    startingStep: 1
  steps:
    # Gate at 0% user traffic: one new-version pod behind the fixed-name
    # experiment Service (matching the VirtualService "experiment: true"
    # header route), probed through the real ingress. The experiment ends as
    # soon as both analyses finish; a version-check failure aborts before any
    # user sees the canary.
    #
    # Two analyses, deliberately different in weight. version-check is the gate
    # and asks the new pods only about themselves, so promotion never hinges on
    # a free third-party API being up. api-test exercises the live Overpass and
    # Open-Meteo path but is informational (see analysisTemplate.yml): it
    # reports, it cannot block.
    - experiment:
        templates:
          - name: canary
            specRef: canary
            replicas: 1
            service:
              name: bluebird-experiment
        analyses:
          - name: version-check
            templateName: bluebird-version-check
            requiredForCompletion: true
          - name: api-test
            templateName: bluebird-api-test
            requiredForCompletion: true
    - setWeight: 33
    - setWeight: 66
    - setWeight: 100

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true

experiment:
  enabled: true
  host: bluebird-experiment
