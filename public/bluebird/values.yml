replicas: 3

revisionHistoryLimit: 1
analysis:
  successfulRunHistoryLimit: 1
  unsuccessfulRunHistoryLimit: 2

extraEnv:
  - name: LOG_LEVEL
    value: INFO

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
  readiness:
    httpGet:
      path: /healthz
      port: 8000
  startup:
    httpGet:
      path: /healthz
      port: 8000

strategy: Canary
canary:
  steps:
    - setCanaryScale:
        replicas: 1
    - analysis:
        templates:
          - templateName: version-check
    - analysis:
        templates:
          - templateName: api-test

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true

# Renders the VirtualService route sending `experiment: true` to the canary.
# Empty host = the chart default, bluebird-canary, which exists for the whole
# rollout.
experiment:
  enabled: true
  host: ""
