# No `replicas` here on purpose: the chart omits spec.replicas entirely while
# autoscaling is enabled, so Argo CD cannot fight the HPA over it, and
# autoscaling.minReplicas below is the floor instead.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

# Keeps 2 pods through a node drain. PDB percentages round UP, so minAvailable
# 50% requires 2 of 3 to survive where maxUnavailable 50% would permit 2
# disruptions and leave 1.
podDisruptionBudget:
  enabled: true

# One pod per worker node while nodes last, collapsing gracefully when they do
# not: 3 nodes gives [1,1,1], 2 gives [2,1] with nothing Pending, 1 gives [3].
#
# nodeTaintsPolicy is load-bearing, not decoration. It defaults to Ignore,
# which makes EVERY node an eligible domain -- including the three
# control-plane nodes this pod has no toleration for. Skew is measured against
# the global minimum across eligible domains, so those permanently empty
# domains pin that minimum at 0, and maxSkew 1 then allows at most one pod per
# worker: a hard ceiling of 3 pods cluster-wide, below the 6 a canary needs at
# its last step. Honor counts only nodes the pod could actually land on, so the
# domain set is the 3 workers, the minimum is 1, and [2,2,2] schedules. It also
# keeps `kubectl drain` working, since a cordoned node carries the
# unschedulable taint and would otherwise become one more empty domain.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor

revisionHistoryLimit: 1

extraEnv:
  - name: LOG_LEVEL
    value: INFO

# Scrape the pods' Prometheus surface (bluebird#77). Requires the chart
# version that renders the PodMonitor: merge AFTER that chart release, the
# same rule as the route note below. On an older chart the value is inert
# and Prometheus simply has no bluebird targets.
metrics:
  podMonitor:
    enabled: true

useRollout: true
strategy: Canary

canary:
  steps:
    - setCanaryScale:
        replicas: 1
    # Validate that the canary is running the expected version of Bluebird
    - analysis:
        templates:
          - templateName: version-check
        args:
          - name: version
            valueFrom:
              fieldRef:
                fieldPath: spec.template.spec.containers[0].image
    # Validate that the canary API is responding successfully
    - analysis:
        templates:
          - templateName: api-test
    # Watch the canary's own 5xx ratio in Prometheus before promoting. The
    # canary takes no user traffic during these steps (weight stays 0), so
    # the signal is deliberately synthetic: its probes, the version check,
    # and api-test's full analyze (TJ, 2026-08-21). Needs the monitoring
    # stack running and the PodMonitor above: with no role="canary" series
    # the query reads 0 and passes, but an UNREACHABLE Prometheus errors the
    # analysis and aborts the rollout, so this merges last.
    - analysis:
        templates:
          - templateName: error-rate
  trafficRouting:
    istio:
      virtualService:
        name: bluebird
        routes:
          - bluebird-stable
          # The public-API allowlist route (bluebird#240). Named here so a
          # canary weights API traffic too, not only the SPA. Requires the
          # chart version that renders it: merge AFTER that chart release,
          # or the next rollout fails to find the route.
          - bluebird-api-public
          # The keyed analyze route (bluebird#317), for the same reason: a
          # route left off this list stays 100/0 stable through a rollout,
          # so a weighted step would skip API callers with their own key.
          - bluebird-api-keyed
          # Each route above has an -off-tunnel twin while
          # ingress.tunnel.peerRegex is set (bluebird#631): the same paths for
          # a request that did not come through cloudflared, with
          # CF-Connecting-IP removed. Listed so LAN and in-mesh traffic follows
          # a canary too. They exist only while that value is set, and a listed
          # route that does not exist fails the next rollout, so the two
          # change together.
          - bluebird-stable-off-tunnel
          - bluebird-api-public-off-tunnel
          - bluebird-api-keyed-off-tunnel

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true
  # The gateway is also the LAN address 192.168.40.150 and serves these hosts
  # there, so a device on the home network could reach it without the tunnel
  # and set CF-Connecting-IP, which the app's rate limiter believes
  # (bluebird#631). The gateway keeps that header only when the peer it saw is
  # a cloudflared pod: an address in flannel's 10.244.0.0/16, but not a node's
  # .0 (flannel.1) or .1 (cni0), which are what kube-proxy rewrites a LAN
  # client's address to on the way to a gateway Service with
  # externalTrafficPolicy Cluster. Any other peer has the header removed and is
  # counted under the address the gateway saw. A CNI or pod CIDR change means
  # deriving this again.
  tunnel:
    peerRegex: '10\.244\.\d+\.(?:[2-9]|[1-9]\d|1\d\d|2[0-4]\d|25[0-5])'
