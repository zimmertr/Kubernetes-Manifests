replicas: 3

revisionHistoryLimit: 1
analysis:
  successfulRunHistoryLimit: 1
  unsuccessfulRunHistoryLimit: 2

extraEnv:
  - name: LOG_LEVEL
    value: INFO

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
  readiness:
    httpGet:
      path: /healthz
      port: 8000
  startup:
    httpGet:
      path: /healthz
      port: 8000

strategy: Canary
canary:
  steps:
    - setCanaryScale:
        replicas: 1
    # Validate that the canary is running the expected version of Bluebird
    - analysis:
        templates:
          - templateName: version-check
        args:
          - name: version
            valueFrom:
              fieldRef:
                fieldPath: spec.template.spec.containers[0].image
    # Validate that the canary API is responding successfully
    - analysis:
        templates:
          - templateName: api-test

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true

# Renders the VirtualService route sending `experiment: true` to the canary.
# The chart defaults enabled to false, so dropping this block removes the route
# entirely. Empty host = the chart default, bluebird-canary.
experiment:
  enabled: true
  host: ""
