replicas: 3

revisionHistoryLimit: 1

extraEnv:
  - name: LOG_LEVEL
    value: INFO

useRollout: true
strategy: Canary

canary:
  steps:
    - setCanaryScale:
        replicas: 1
    # Validate that the canary is running the expected version of Bluebird
    - analysis:
        templates:
          - templateName: version-check
        args:
          - name: version
            valueFrom:
              fieldRef:
                fieldPath: spec.template.spec.containers[0].image
    # Validate that the canary API is responding successfully
    - analysis:
        templates:
          - templateName: api-test
  trafficRouting:
    istio:
      virtualService:
        name: bluebird
        routes:
          - bluebird-stable

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true
