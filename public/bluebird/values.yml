replicas: 3
strategy: Canary
canary:
  dynamicStableScale: true
  trafficRouting:
    istio:
      virtualService:
        name: bluebird
        routes:
          - bluebird-stable
  # Continuous tripwire: the controller polls the canary Service from the
  # first traffic step until completion and aborts the rollout (auto
  # rollback) if the new version stops responding.
  analysis:
    templates:
      - templateName: bluebird-health
    startingStep: 1
  steps:
    # Gate at 0% user traffic: one new-version pod behind the fixed-name
    # experiment Service (matching the VirtualService "experiment: true"
    # header route), smoke-tested end-to-end through the real ingress with
    # a live /api/analyze call. The experiment ends as soon as the analysis
    # passes; a failure aborts before any user sees the canary.
    - experiment:
        templates:
          - name: canary
            specRef: canary
            replicas: 1
            service:
              name: bluebird-experiment
        analyses:
          - name: api-test
            templateName: bluebird-api-test
            requiredForCompletion: true
    - setWeight: 33
    - setWeight: 66
    - setWeight: 100

ingress:
  enabled: true
  hosts:
    - ganymede.sol.milkyway
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  httpsRedirect: true
  tls:
    enabled: true
    credentialName: bluebird
  mesh: true

experiment:
  enabled: true
  host: bluebird-experiment
