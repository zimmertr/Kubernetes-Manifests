namespace: strava-heatmap-proxy-system

resources:
  - resources/namespace.yml
  - resources/deployment.yml
  - resources/service.yml
  - resources/istio/gateway.yml
  - resources/istio/virtualService.yml

configMapGenerator:
  - name: strava-heatmap-proxy-config
    literals:
      # Athlete id of the account the cookie secret belongs to. It is the number
      # in the profile URL (strava.com/athletes/<id>). Personal tiles are signed
      # for that athlete only, so this is the one value to change when reusing
      # this project with a different account.
      - STRAVA_ATHLETE_ID=22080449

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: patrickziegler/strava-heatmap-proxy
    # Upstream publishes only :latest and one tag per commit, no semver image
    # tags, so :latest is pinned by digest. Renovate's kustomize manager bumps
    # the digest whenever upstream pushes to main. The digest below is the
    # commit that carries the _strava4_session fix
    # (patrickziegler/strava-heatmap-proxy#33).
    newTag: latest
    digest: sha256:064630ffd8a8d3e05e85793bbf6d8384904285d517f2dc3641e5b9279a59ee67
