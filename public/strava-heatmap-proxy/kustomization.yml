namespace: strava-heatmap-proxy-system

resources:
  - resources/namespace.yml
  - resources/deployment.yml
  - resources/service.yml
  - resources/istio/gateway.yml
  - resources/istio/virtualService.yml

configMapGenerator:
  - name: strava-heatmap-proxy-config
    literals:
      # Athlete id of the account the cookie secret belongs to. It is the number
      # in the profile URL (strava.com/athletes/<id>). Personal tiles are signed
      # for that athlete only, so this is the one value to change when reusing
      # this project with a different account.
      - STRAVA_ATHLETE_ID=22080449

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: patrickziegler/strava-heatmap-proxy
    # Temporarily built from my fork: upstream drops the _strava4_session cookie
    # after its first refresh, which breaks the personal heatmap (401). The tag
    # is the fork commit. Switch back to the upstream image and commit tag once
    # https://github.com/zimmertr/strava-heatmap-proxy-2/pull/1 lands upstream.
    # Renovate cannot bump commit tags, so bumps are a deliberate edit here.
    newName: zimmertr/strava-heatmap-proxy
    newTag: 14dd67e7f0a7a2f8e5fd25bc66fe995b6c0db0c2
