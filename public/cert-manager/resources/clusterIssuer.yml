apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: 'tj@tjzimmerman.com'
    privateKeySecretRef:
      name: letsencrypt
    solvers:
      # DNS-01 via Cloudflare. The origin sits behind the Cloudflare proxy,
      # so HTTP-01 is unreliable; DNS-01 also supports wildcards.
      # Token secret is created out-of-band (see public/cert-manager/README.md).
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
