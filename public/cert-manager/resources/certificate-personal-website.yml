apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: personal-website
  # The shared Istio gateway only reads TLS secrets from its own namespace.
  namespace: istio-gateway
spec:
  secretName: personal-website
  commonName: tjzimmerman.com
  dnsNames:
    - tjzimmerman.com
    - tjzimmerman.dev
    - www.tjzimmerman.com
    - www.tjzimmerman.dev
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
