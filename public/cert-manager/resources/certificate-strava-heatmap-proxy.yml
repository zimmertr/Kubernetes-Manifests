apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: strava-heatmap-proxy
  # The shared Istio gateway only reads TLS secrets from its own namespace.
  namespace: istio-gateway
spec:
  secretName: strava-heatmap-proxy
  commonName: stravaproxy.tjzimmerman.com
  dnsNames:
    - stravaproxy.tjzimmerman.com
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
