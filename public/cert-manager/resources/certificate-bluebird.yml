apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bluebird
  # The shared Istio gateway only reads TLS secrets from its own namespace.
  namespace: istio-gateway
spec:
  secretName: bluebird
  commonName: bluebirdforecast.com
  dnsNames:
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
