apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bluebird-pr
  namespace: argo-system
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: zimmertr
          repo: bluebird
          labels:
            - create pr container
        requeueAfterSeconds: 150
  template:
    metadata:
      name: "bluebird-pr-{{ .number }}"
      labels:
        app-group: public
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bluebird-pr
      # Previews run in a namespace of their own, apart from production in
      # bluebird-system (zimmertr/bluebird#637). One namespace for every
      # preview rather than one per PR: appproject.yml beside this file
      # creates it with its labels, so the project needs no cluster-scoped
      # permission and no empty namespace is left behind when a PR closes.
      destination:
        server: https://kubernetes.default.svc
        namespace: bluebird-pr-system
      source:
        repoURL: oci://registry-1.docker.io/zimmertr/bluebird-helm
        chart: bluebird-helm
        targetRevision: 0.16.2
        helm:
          releaseName: "bluebird-pr-{{ .number }}"
          valuesObject:
            image:
              name: zimmertr/bluebird-pr
              tag: "pr-{{ .number }}-{{ .head_sha }}"
            ingress:
              enabled: true
              hosts:
                - "pr-{{ .number }}.ganymede.sol.milkyway"
              # Preview hosts resolve only on the LAN, and the PR containers
              # are where the analyze API is exercised, so the public-API
              # allowlist the chart ships by default (bluebird#240) is off
              # here and the whole surface is published.
              publishFullApi: true
            extraEnv:
              - name: PREVIEW_BANNER
                value: "true"
              - name: PREVIEW_PR
                value: "{{ .number }}"
              - name: PREVIEW_COMMIT
                value: "{{ .head_sha }}"
              - name: LOG_LEVEL
                value: "TRACE"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # The namespace comes from the root-appprojects Application, which
        # syncs on its own clock, so a preview generated first finds no
        # namespace and its sync fails. Retrying covers that gap without
        # letting each preview create a bare, unlabelled namespace itself.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
