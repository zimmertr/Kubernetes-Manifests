apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  # Two replicas so a node drain or a rolling image bump never drops the only
  # ingress path. cloudflared opens redundant edge connections per replica and
  # Cloudflare load-balances across them, so this is active/active.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        # cloudflared must NOT be meshed: it originates its own TLS to the ingress
        # gateway with the public hostname as SNI, and a sidecar would intercept
        # that connection. The namespace carries no istio-injection label today
        # (namespace.yml sets none), so this opt-out is what keeps the pod out of
        # the mesh if one is ever added there.
        sidecar.istio.io/inject: "false"
    spec:
      # cloudflared never calls the Kubernetes API, so the service account token
      # would only be a credential for whoever can run code in the pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          ports:
            - name: metrics
              containerPort: 2000
          # /ready flips true only while an edge connection is registered, so it
          # is both the liveness and readiness signal.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
      # Keep the two replicas on different nodes so a single node loss cannot
      # take both down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
