resources:
  - resources/namespace.yml
  - resources/persistentVolume.yml
  - resources/persistentVolumeClaim.yml
  - resources/scrapeConfig-etcd.yml

namespace: prometheus-system

# Dashboards ride plain JSON files; Grafana's sidecar loads any ConfigMap
# carrying the grafana_dashboard label, so adding one is adding a file here.
configMapGenerator:
  - name: bluebird-dashboard
    files:
      - bluebird.json=files/bluebird-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - includeCRDs: true
    name: kube-prometheus-stack
    namespace: prometheus-system
    releaseName: prometheus
    repo: https://prometheus-community.github.io/helm-charts
    # Helm-test hook pods (Grafana ships one) are not applyable resources:
    # under Argo they would be created once and then sit forever OutOfSync.
    skipTests: true
    valuesFile: values.yml
    version: 88.5.2 # https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
