alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: proxmox-flashpool
          volumeName: alertmanager-data
  service:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.40.112
    type: LoadBalancer

grafana:
  # This repo is public, so the admin credential lives in a Secret created
  # out-of-band (see the README), never in this file.
  admin:
    existingSecret: grafana-admin
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: istio
          orgId: 1
          folder: "Istio"
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/istio
  dashboards:
    istio:
      Istio-Control-Plane:
        gnetId: 7645
        datasource: Prometheus
      Istio-Mesh:
        gnetId: 7639
        datasource: Prometheus
      Istio-Service:
        gnetId: 7636
        datasource: Prometheus
      Istio-Workload:
        gnetId: 7630
        datasource: Prometheus
  persistence:
    type: pvc
    enabled: true
    storageClassName: proxmox-flashpool
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    existingClaim: grafana-data
  service:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.40.110
    type: LoadBalancer

# The etcd, kube-scheduler, kube-controller-manager, and kube-proxy scrapes
# stay at their chart defaults (enabled). Talos binds all four to localhost
# out of the box, so their exposure is machine configuration, not values:
# TJs-Kubernetes-Service#58 sets the bind addresses. Until that is applied
# to the nodes, these targets show down and their *Down alerts fire.

# etcd alone also needs its endpoints NAMED. Talos runs etcd as a host
# service rather than a kube-system pod, so the chart's selector-based
# Service matches nothing and the etcd target silently does not exist —
# absent, not red, which is worse. Naming the control-plane addresses makes
# the chart build a manual Endpoints object instead; 2381 is the chart's
# default port and the listener TJs-Kubernetes-Service#58 exposes.
kubeEtcd:
  endpoints:
    - 192.168.40.11
    - 192.168.40.12
    - 192.168.40.13

prometheusOperator:
  admissionWebhooks:
    # cert-manager issues the webhook certs. The default is a pair of helm
    # hook Jobs, and Jobs are immutable: on the next chart bump Argo cannot
    # re-apply them and the app wedges OutOfSync.
    certManager:
      enabled: true

prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: 'istiod'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istiod;http-monitoring
      - job_name: 'envoy-stats'
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: '.*-envoy-prom'
    # The default (true) only selects monitors carrying this release's label,
    # which silently ignores monitors shipped by app charts — the bluebird
    # PodMonitor arrives with the bluebird chart, not with this one.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    # Size is the only retention bound: history grows until 90GB, then the
    # oldest blocks go — months of data at this cluster's cardinality. The
    # empty time retention is load-bearing, not decoration: it defeats the
    # chart's 10d default, and the operator's own 24h fallback applies only
    # when BOTH fields are empty. 90GB decimal ≈ 84Gi, comfortable headroom
    # on the 100Gi volume.
    retention: ""
    retentionSize: 90GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: proxmox-flashpool
          volumeName: prometheus-data
  service:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.40.111
    type: LoadBalancer
