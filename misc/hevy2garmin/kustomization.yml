namespace: hevy2garmin-system

resources:
- resources/namespace.yml
- resources/cluster.yml
- resources/deployment.yml
- resources/service.yml
- resources/cronjob.yml
- resources/persistentVolumeClaim.yml
- resources/trainer-sync.yml

    # Upstream publishes no image. This one is web/Dockerfile from
    # drkostas/hevy2garmin, built on my Mac and tagged with the upstream commit
    # it was built from (see README.md). Renovate can't follow a commit tag, so
    # bumping it is a manual rebuild.
    # Built from github.com/zimmertr/hevy-trainer-sync and tagged with its
    # commit, same deal as above.
images:
- name: zimmertr/hevy-trainer-sync
  newName: zimmertr/hevy-trainer-sync
  newTag: 78d0773f27e8fb223e18d6f8405e562dc60d9df4
- name: zimmertr/hevy2garmin-web
  newTag: f0f6755228776197f52a32cd15ab32cb948a2dd4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
