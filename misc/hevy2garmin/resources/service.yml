apiVersion: v1
kind: Service
metadata:
  name: hevy2garmin
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.40.102
spec:
  # LAN only. The Hevy webhook would need a public URL and isn't used; the
  # CronJob below drives the sync instead.
  type: LoadBalancer
  selector:
    app: hevy2garmin
  ports:
    - name: http
      port: 80
      targetPort: http
