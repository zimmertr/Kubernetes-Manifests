# Polls Hevy's workout events every minute from in here, so nothing is
# exposed. Each new workout waits until Garmin has the watch's activity for
# it, and only then is hevy2garmin's webhook route called, so its first try
# merges and it never uploads an activity of its own. A session the watch
# didn't record stays in Hevy; only the watch ever reaches Strava.
#
# It needs no Hevy session and no volume, so it never races the trainer sync
# CronJob for the rotating token. It reads hevy2garmin's database for the
# Garmin token, the merge settings and which workouts are done, and uses the
# dashboard password only to have Garmin's token refreshed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hevy-trainer-poll
spec:
  replicas: 1
  # Two pollers would only call the webhook twice, which hevy2garmin copes
  # with, but there is no reason to overlap them either.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hevy-trainer-poll
  template:
    metadata:
      labels:
        app: hevy-trainer-poll
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hevy-trainer-poll
          image: zimmertr/hevy-trainer-sync
          args: ["poll"]
          env:
            - name: HEVY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hevy2garmin
                  key: hevy-api-key
            - name: H2G_URL
              value: http://hevy2garmin
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: hevy2garmin
                  key: cron-secret
            - name: H2G_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hevy2garmin
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hevy2garmin-database-app
                  key: uri
          # 17Mi before it read the database. psycopg loads libpq when the
          # first workout waits, so the limit matches the trainer sync's.
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
