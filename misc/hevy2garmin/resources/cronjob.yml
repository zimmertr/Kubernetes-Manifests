# The web app has no timer of its own. This calls its cron route, which syncs
# every unsynced Hevy workout two hours after it ends, merging into the
# watch's activity when there is one and uploading a fresh activity when
# there isn't. Garmin posts that upload to Strava, so a watch that synced late
# meant the session twice.
#
# Suspended: hevy-trainer-poll starts every merge once the watch's activity is
# on Garmin, and a workout the watch never recorded is meant to stay in Hevy.
# See hevy-trainer-sync's decision record 0039.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hevy2garmin-sync
spec:
  schedule: "*/15 * * * *"
  suspend: true
  # A sync that is still running holds the lock the next one would need.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The route syncs up to 50 workouts in one call, each a Garmin upload.
      activeDeadlineSeconds: 1000
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # The curl image's unprivileged user.
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: curl
              image: curlimages/curl:8.16.0 # https://github.com/curl/curl-container/releases
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hevy2garmin
                      key: cron-secret
              command:
                - /bin/sh
                - -c
                - >-
                  curl -fsS --max-time 900
                  -H "Authorization: Bearer $CRON_SECRET"
                  http://hevy2garmin/api/cron/sync
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
