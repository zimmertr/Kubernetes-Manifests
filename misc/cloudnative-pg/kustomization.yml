# The CloudNativePG operator. It runs the PostgreSQL clusters other apps
# declare, in any namespace: today Bluebird Forecast's shared cache
# (public/bluebird, bluebird#760). Its own app because its CRDs and webhooks
# are cluster-wide and installed once, before anything that uses them.
#
# Outside the Istio mesh, so the API server reaches its webhooks directly. It
# reaches each database pod's status port through the mesh's permissive mTLS;
# a STRICT PeerAuthentication in a database's namespace would need a port
# exception for that.
resources:
  - resources/namespace.yml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1 # https://github.com/cloudnative-pg/charts/releases
    releaseName: cnpg
    namespace: postgres-system

# The CRDs are larger than the 256 KiB a client-side apply can record in its
# annotation, so Argo CD applies them server-side. The chart's CRD template
# takes no annotations, hence the patch.
patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: .*\.cnpg\.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
