apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: misc
  namespace: argo-system
  annotations:
    # argocd-diff-preview (pr.yml) renders this set only when a file under
    # misc/ changes, and each app only when a file under its own path does.
    argocd-diff-preview/watch-pattern: "misc/.*"
spec:
  generators:
    - git:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        revision: main
        directories:
          - path: "misc/*"
          - exclude: true
            path: "misc/*.disable*"
          # Owns its own ApplicationSet + AppProject (applied by the root generators).
          - exclude: true
            path: "misc/hevy-garmin-sync-pr"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      annotations:
        argocd-diff-preview/watch-pattern: "{{ path }}/.*"
      name: "{{ path.basenameNormalized }}"
      labels:
        app-group: misc
    spec:
      project: misc
      source:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        targetRevision: main
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
