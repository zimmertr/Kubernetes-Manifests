# A static volume rather than a dynamic one, so accounts, chats and generated
# images outlive the app and the cluster.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: open-webui-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  csi:
    driver: csi.proxmox.sinextra.dev
    fsType: xfs
    volumeAttributes:
      cache: writethrough
      ssd: "true"
      storage: FlashPool
    volumeHandle: sol-milkyway/earth/FlashPool/vm-9999-Open-WebUI-Data
  mountOptions:
    - noatime
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/region
          operator: In
          values:
            - sol-milkyway
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - earth
  persistentVolumeReclaimPolicy: Retain
  storageClassName: proxmox-flashpool
