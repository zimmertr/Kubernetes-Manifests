resources:
  - resources/namespace.yml

helmCharts:
  - name: amd-gpu
    repo: https://rocm.github.io/k8s-device-plugin
    version: 0.22.0 # https://github.com/ROCm/k8s-device-plugin/releases
    releaseName: amd-gpu
    # Its own namespace, labeled privileged because both DaemonSets mount host
    # paths, rather than kube-system's blanket Pod Security exemption.
    namespace: amd-gpu-device-plugin-system
    valuesFile: values.yml
