# A static volume rather than a dynamic one, so the models outlive the app and
# the cluster. Rebuilding either reattaches the same zvol instead of downloading
# hundreds of gigabytes again.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-swap-models
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 500Gi
  csi:
    driver: csi.proxmox.sinextra.dev
    fsType: xfs
    volumeAttributes:
      cache: writethrough
      ssd: "true"
      storage: FlashPool
    volumeHandle: sol-milkyway/earth/FlashPool/vm-9999-AI-Models
  mountOptions:
    - noatime
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/region
          operator: In
          values:
            - sol-milkyway
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - earth
  persistentVolumeReclaimPolicy: Retain
  storageClassName: proxmox-flashpool
