apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  labels:
    app: llama-swap
spec:
  replicas: 1
  # There's one GPU and the volume attaches to one node, so the old pod has to
  # let go of both before the new one can start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # Only fix ownership when the volume's root is wrong, rather than
        # walking hundreds of gigabytes of models on every start.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-swap
          image: ghcr.io/mostlygeek/llama-swap
          # The image's entrypoint reads /app/config.yaml with -watch-config.
          # The config comes from a generated ConfigMap instead.
          command: ["/app/llama-swap"]
          args: ["-config", "/config/config.yaml", "-listen", ":8080"]
          env:
            - name: LLAMA_SWAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-swap-api-key
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /health answers without an API key, and stays up while a model
          # loads or swaps.
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: models
              mountPath: /models
      volumes:
        - name: config
          configMap:
            name: llama-swap-config
        - name: models
          persistentVolumeClaim:
            claimName: llama-swap-models
