# The chart is built for kubeswap, which runs every model as its own pod. Here
# llama-swap runs the models itself, in this pod, on the one GPU, so kubeswap's
# RBAC and its garbage-collecting init container aren't needed.
serviceAccount:
  create: false
rbac:
  create: false
gcInitContainer:
  enabled: false

# The image defaults to unified-vulkan-<release>, which bundles llama-server and
# sd-server. Its only pinned tags run as root, so the pod drops to the UID of
# its rootless variant instead.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Only fix ownership when the volume's root is wrong, rather than walking
  # hundreds of gigabytes of models on every start.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Requesting the GPU is what mounts it into the container, and it also adds
# the toleration for the GPU node's taint. The selector says outright which
# node is meant, as the device plugin and exporter do.
nodeSelector:
  tks.io/pool: gpu

# No memory limit, since llama.cpp memory-maps the model files and a limit
# would count that page cache against the pod.
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    amd.com/gpu: 1

env:
  - name: LLAMA_SWAP_API_KEY
    valueFrom:
      secretKeyRef:
        name: llama-swap-api-key
        key: api-key
  - name: LLAMA_SWAP_OPEN_WEBUI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llama-swap-open-webui-api-key
        key: api-key
  - name: LLAMA_SWAP_LITELLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: llama-swap-litellm-api-key
        key: api-key
  - name: LLAMA_CACHE
    value: /models
  # Mesa compiles the GPU's shaders on every model load unless it can cache
  # them, and the image's home directory isn't writable by this user.
  - name: MESA_SHADER_CACHE_DIR
    value: /models/.cache/mesa

# Downloads the models the config names, including ones added while the pod
# runs. It's a native sidecar, an init container that keeps running, so
# llama-swap starts without waiting for downloads. The llama-swap image doesn't
# ship the llama binary, so this runs llama.cpp's CPU image.
initContainers:
  - name: model-downloader
    image: ghcr.io/ggml-org/llama.cpp:light-b11541
    restartPolicy: Always
    command: ["/bin/bash", "/scripts/model-downloader.sh"]
    env:
      - name: LLAMA_CACHE
        value: /models
      # A model no config names any more is deleted once it has been unused
      # this long. Three days covers a mistake noticed after a weekend.
      - name: PRUNE_AFTER_HOURS
        value: "72"
      # Only gated repos need it, so the Secret is optional.
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llama-swap-hf-token
            key: token
            optional: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: model-downloader
        mountPath: /scripts
        readOnly: true
      - name: config
        mountPath: /config
        readOnly: true
      - name: extra-config
        mountPath: /extra
        readOnly: true
      - name: models
        mountPath: /models

extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llama-swap-models
  - name: extra-config
    configMap:
      name: llama-swap-extra-config
      optional: true
  - name: model-downloader
    configMap:
      name: llama-swap-model-downloader
  - name: chat-templates
    configMap:
      name: llama-swap-chat-templates
extraVolumeMounts:
  - name: models
    mountPath: /models
  - name: extra-config
    mountPath: /etc/llama-swap/extra
    readOnly: true
  - name: chat-templates
    mountPath: /etc/llama-swap/templates
    readOnly: true

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.40.140

# The config lives in configs/config.yaml, and Kustomize turns it into this
# ConfigMap. When it changes, llama-swap reloads it and the model downloader
# fetches any new models, without restarting the pod.
config:
  existing: llama-swap-config
