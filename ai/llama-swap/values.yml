# The chart is built for kubeswap, which runs every model as its own pod. Here
# llama-swap runs the models itself, in this pod, on the one GPU, so kubeswap's
# RBAC and its garbage-collecting init container aren't needed.
serviceAccount:
  create: false
rbac:
  create: false
gcInitContainer:
  enabled: false

# The image defaults to unified-vulkan-<release>, which bundles llama-server and
# sd-server. Its only pinned tags run as root, so the pod drops to the UID of
# its rootless variant instead.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Only fix ownership when the volume's root is wrong, rather than walking
  # hundreds of gigabytes of models on every start.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Requesting the GPU is what mounts it into the container, and it also adds
# the toleration for the GPU node's taint. The selector says outright which
# node is meant, as the device plugin and exporter do.
nodeSelector:
  tks.io/pool: gpu

# No memory limit, since llama.cpp memory-maps the model files and a limit
# would count that page cache against the pod.
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    amd.com/gpu: 1

env:
  - name: LLAMA_SWAP_API_KEY
    valueFrom:
      secretKeyRef:
        name: llama-swap-api-key
        key: api-key
  - name: LLAMA_CACHE
    value: /models
  # Mesa compiles the GPU's shaders on every model load unless it can cache
  # them, and the image's home directory isn't writable by this user.
  - name: MESA_SHADER_CACHE_DIR
    value: /models/.cache/mesa

# Downloads every model in the config that isn't on /models yet. -hf models use
# llama.cpp's own downloader, which skips a cached copy that still matches
# Hugging Face. The llama-swap image doesn't ship the llama binary, so this
# runs llama.cpp's CPU image. Files under /models/hf/ are fetched with curl,
# once.
initContainers:
  - name: download-models
    image: ghcr.io/ggml-org/llama.cpp:light-b11541
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -eu
        # Neither downloader shows progress without a terminal, so report every
        # file still downloading every 30 seconds, as one line each.
        report_progress() {
          while sleep 30; do
            find /models \( -name '*.downloadInProgress' -o -name '*.part' \) | while read -r f; do
              name=$(basename "$f" | sed -E 's/\.(downloadInProgress|part)$//')
              # llama.cpp names its file after a hash, so use the repo it's cached under.
              case "$f" in */models--*/blobs/*) name=$(echo "$f" | sed -E 's#.*/models--([^/]+)/blobs/.*#\1#; s#--#/#g') ;; esac
              key=$(basename "$f")
              size=$(stat -c %s "$f")
              last=$(cat "/tmp/$key.size" 2> /dev/null || true)
              echo "$size" > "/tmp/$key.size"
              awk -v n="$name" -v s="$size" -v l="$last" 'BEGIN {
                printf "  %s: %.1f GB", n, s / 1e9
                if (l != "") printf ", %.0f MB/s", (s - l) / 30 / 1e6
                printf "\n"
              }'
            done
          done
        }
        report_progress &
        reporter=$!
        trap 'kill "$reporter" 2> /dev/null || true' EXIT

        configs="/config/config.yaml $(ls /extra/*.yaml /extra/*.yml 2> /dev/null || true)"
        # Only lines that start with the flag, so comments that mention one don't count.
        for model in $(grep -hE '^[[:space:]]*-hf[[:space:]]' $configs | awk '{print $2}' | sort -u); do
          echo "Checking $model"
          /app/llama download -hf "$model"
        done
        if [ -n "${HF_TOKEN:-}" ]; then set -- -H "Authorization: Bearer $HF_TOKEN"; else set --; fi
        for path in $(grep -hE '^[[:space:]]*--[a-z-]+[[:space:]]+/models/hf/' $configs | awk '{print $2}' | sort -u); do
          file=${path#/models/hf/}
          if [ -f "$path" ]; then
            echo "Already have $file"
            continue
          fi
          repo=$(echo "$file" | cut -d/ -f1-2)
          echo "Downloading $file"
          mkdir -p "$(dirname "$path")"
          curl -fsSL --retry 3 "$@" -o "$path.part" "https://huggingface.co/$repo/resolve/main/${file#"$repo"/}"
          mv "$path.part" "$path"
        done
        echo "All models present: $(du -sh /models | cut -f1) on /models"
    env:
      - name: LLAMA_CACHE
        value: /models
      # Only gated repos need it, so the Secret is optional.
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llama-swap-hf-token
            key: token
            optional: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: config
        mountPath: /config
        readOnly: true
      - name: extra-config
        mountPath: /extra
        readOnly: true
      - name: models
        mountPath: /models

extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llama-swap-models
  - name: extra-config
    configMap:
      name: llama-swap-extra-config
      optional: true
extraVolumeMounts:
  - name: models
    mountPath: /models
  - name: extra-config
    mountPath: /etc/llama-swap/extra
    readOnly: true

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.40.140

# The config lives in configs/config.yaml. Kustomize turns it into this
# ConfigMap, whose name gets a hash of the file, so a change rolls the pod.
config:
  existing: llama-swap-config
