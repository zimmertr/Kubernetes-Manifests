namespace: llama-swap-system

resources:
  - resources/namespace.yml
  - resources/persistentVolume.yml
  - resources/persistentVolumeClaim.yml

helmCharts:
  - name: llama-swap
    repo: oci://ghcr.io/mostlygeek/charts
    version: 263.0.0 # https://github.com/mostlygeek/llama-swap/releases
    releaseName: llama-swap
    namespace: llama-swap-system
    valuesFile: values.yml

configMapGenerator:
  - name: llama-swap-config
    files:
      - configs/config.yaml

# The chart sets llama-swap's arguments itself, with no way to add one.
patches:
  - target:
      kind: Deployment
      name: llama-swap
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -config-dir
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: /etc/llama-swap/private
