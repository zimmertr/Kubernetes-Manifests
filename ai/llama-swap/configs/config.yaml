# https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

# Loading a large model from disk into VRAM can take minutes.
healthCheckTimeout: 300
logToStdout: "proxy,upstream"

# One key per client, so each can be revoked on its own.
apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"
  - "${env.LLAMA_SWAP_OPEN_WEBUI_API_KEY}"
  - "${env.LLAMA_SWAP_LITELLM_API_KEY}"

# A request to /upstream/<model>/<path> loads that model, as any request does.
# Prometheus scrapes every language model's /metrics there on a schedule, and
# that mustn't swap models under a user: an ignored path answers 409 when its
# model isn't loaded, which Prometheus records as the target being down. The
# first pattern is llama-swap's default, restated because setting the list
# replaces it.
upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - '^/metrics$'

macros:
  # llama-server listens on loopback only. Clients reach it through
  # llama-swap, which checks the API key. --offline loads models from the cache
  # on /models without touching the network, since the model downloader
  # fetches them, and a model still downloading fails at once. Flash attention
  # is the default on Vulkan, but stated so a change in the default can't
  # silently cost it: without it, prompt processing at 32k of context fell
  # from 1,662 to 61 tok/s on the 35B. --metrics is llama-server's own
  # Prometheus endpoint, which Prometheus scrapes through llama-swap's
  # /upstream path: llama-swap's /metrics has only host and GPU stats, not
  # tokens or requests.
  "llama-server": >-
    llama-server
    --host 127.0.0.1
    --port ${PORT}
    --n-gpu-layers 999
    --flash-attn on
    --jinja
    --offline
    --metrics
  # One slot: two slots sharing a KV cache halved the 35B's generation speed,
  # and requests finish sooner one after the other than side by side. Each
  # model sets its context explicitly rather than leaving it to --fit, which
  # quietly falls back to 4k when the GPU isn't free yet, such as when
  # llama-swap reloads its config. Then the load fails, and llama-swap tries
  # again on the next request.
  "llama-server-coding": >-
    ${llama-server}
    --parallel 1
  # sd-server has no -hf, so it's given file paths. A path under
  # /models/hf/<user>/<repo>/ names a Hugging Face file, which the model
  # downloader links there from llama.cpp's cache.
  "sd-server": >-
    sd-server
    --listen-ip 127.0.0.1
    --listen-port ${PORT}

# Language models name their Hugging Face repo and quantization with -hf, as
# <user>/<repo>:<quant>. The model downloader beside llama-swap fetches every
# -hf and every /models/hf/ path it finds here, so this is also the list of
# models kept on /models.
models:
  # Mixture of experts: 35B weights, about 3B read per token, so it's fast. Its
  # full context fits. A 2048-token micro-batch reads long prompts, such as
  # Claude Code's, 1.5 times faster than the default 512.
  "qwen3.6-35b-a3b":
    cmd: |
      ${llama-server-coding}
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL
      --ctx-size 262144
      --ubatch-size 2048

  # Dense: every weight is read per token, so it's slower and often smarter.
  # 160k leaves a margin below the most that fits. It keeps the default
  # micro-batch, since 2048 read prompts three times slower on this model.
  "qwen3.6-27b":
    cmd: |
      ${llama-server-coding}
      -hf unsloth/Qwen3.6-27B-GGUF:Q5_K_M
      --ctx-size 163840

  # sd-server has no /health, so llama-swap checks /v1/models instead.
  "z-image-turbo":
    checkEndpoint: /v1/models
    cmd: |
      ${sd-server}
      --diffusion-model /models/hf/leejet/Z-Image-Turbo-GGUF/z_image_turbo-Q8_0.gguf
      --llm /models/hf/unsloth/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --vae /models/hf/Comfy-Org/z_image_turbo/split_files/vae/ae.safetensors
      --diffusion-fa
      --cfg-scale 1.0
      --steps 8

  # Also edits images through /v1/images/edits. The text encoder's vision
  # weights (--llm_vision) are what let it see the images it's given.
  "qwen-image-2.1":
    checkEndpoint: /v1/models
    cmd: |
      ${sd-server}
      --diffusion-model /models/hf/leejet/Qwen-Image-2.1-GGUF/qwen_image_2.1-Q8_0.gguf
      --llm /models/hf/Qwen/Qwen3-VL-8B-Instruct-GGUF/Qwen3VL-8B-Instruct-Q8_0.gguf
      --llm_vision /models/hf/Qwen/Qwen3-VL-8B-Instruct-GGUF/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      --vae /models/hf/Comfy-Org/Qwen-Image-2.1/vae/qwen_image_2.1_vae_bf16.safetensors
      --fa
      --cfg-scale 6.0

  # Ideogram 4 for lettering and photographs. It was trained only on JSON
  # captions, so a plain sentence draws its "Image blocked by safety filter"
  # banner: write the caption to its schema, or have a chat model write it
  # with the magic-prompt system prompt from ideogram-oss/ideogram4. The
  # weights stream from RAM (--offload-to-cpu); with everything in VRAM it
  # was a third slower, not faster.
  "ideogram-4":
    checkEndpoint: /v1/models
    cmd: |
      ${sd-server}
      --diffusion-model /models/hf/leejet/ideogram-4-GGUF/ideogram4-Q4_0.gguf
      --uncond-diffusion-model /models/hf/leejet/ideogram-4-GGUF/ideogram4_uncond-Q4_0.gguf
      --llm /models/hf/Qwen/Qwen3-VL-8B-Instruct-GGUF/Qwen3VL-8B-Instruct-Q8_0.gguf
      --vae /models/hf/Comfy-Org/flux2-dev/split_files/vae/flux2-vae.safetensors
      --offload-to-cpu
      --diffusion-fa

hooks:
  on_startup:
    preload:
      - "qwen3.6-35b-a3b"
