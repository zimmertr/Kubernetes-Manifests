# https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

# Loading a large model from disk into VRAM can take minutes.
healthCheckTimeout: 300
logToStdout: "proxy,upstream"

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # llama-server listens on loopback only. Clients reach it through
  # llama-swap, which checks the API key. --offline loads models from the cache
  # on /models without touching the network, since the init container has
  # already downloaded them.
  "llama-server": >-
    llama-server
    --host 127.0.0.1
    --port ${PORT}
    --n-gpu-layers 999
    --jinja
    --offline

# Each model names its Hugging Face repo and quantization with -hf, as
# <user>/<repo>:<quant>. The init container downloads every -hf it finds here,
# so this is also the list of models kept on /models.
models:
  # A small model to prove the GPU works.
  "qwen3-0.6b":
    cmd: |
      ${llama-server}
      -hf Qwen/Qwen3-0.6B-GGUF:Q8_0
      --ctx-size 8192
