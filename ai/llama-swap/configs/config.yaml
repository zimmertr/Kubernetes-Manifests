# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

# Loading a large model from disk into VRAM can take minutes.
healthCheckTimeout: 300
logToStdout: "proxy,upstream"

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # llama-server listens on loopback only. Clients reach it through llama-swap,
  # which checks the API key.
  "llama-server": >-
    /app/llama-server
    --host 127.0.0.1
    --port ${PORT}
    --n-gpu-layers 999
    --jinja

models:
  # A small model to prove the GPU works. https://huggingface.co/Qwen/Qwen3-0.6B-GGUF
  "qwen3-0.6b":
    cmd: |
      ${llama-server}
      --model /models/Qwen3-0.6B-Q8_0.gguf
      --ctx-size 8192
