# The groundhog2k Postgres beside it, not the chart's bundled one, whose
# Bitnami images are no longer maintained.
db:
  deployStandalone: false
  useExisting: true
  endpoint: litellm-postgres
  database: litellm
  secret:
    name: litellm-postgres
    usernameKey: username
    passwordKey: password
# LiteLLM applies its schema migrations itself at startup. The chart's Job
# would run as an Argo PreSync hook, before Postgres exists on a first sync.
migrationJob:
  enabled: false

image:
  pullPolicy: IfNotPresent

# Clients authenticate with this key in the x-litellm-api-key header.
masterkeySecretName: litellm-master-key
masterkeySecretKey: master-key

# Its own key for llama-swap, so it can be revoked without touching other
# clients.
extraEnvVars:
  - name: LLAMA_SWAP_API_KEY
    valueFrom:
      secretKeyRef:
        name: litellm-llama-swap-api-key
        key: api-key

# A read-only root filesystem makes the chart mount the scratch directories
# LiteLLM writes to.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 512Mi

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.40.142
