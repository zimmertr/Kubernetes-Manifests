namespace: litellm-system

resources:
  - resources/namespace.yml
  - resources/persistentVolume.yml
  - resources/persistentVolumeClaim.yml

helmCharts:
  - name: litellm-helm
    repo: oci://ghcr.io/berriai
    version: 1.105.1 # https://github.com/BerriAI/litellm/releases
    releaseName: litellm
    namespace: litellm-system
    valuesFile: values.yml
    additionalValuesFiles:
      - configs/config.yaml
    # The chart's test hooks are busybox Pods that Argo would run as part of
    # the app.
    skipTests: true
  - name: postgres
    repo: https://groundhog2k.github.io/helm-charts/
    version: 1.6.8 # https://github.com/groundhog2k/helm-charts/releases
    releaseName: litellm-postgres
    namespace: litellm-system
    valuesFile: values-postgres.yml
