# Lives in the istio-gateway namespace so the shared Istio ingress gateway
# can load it via `credentialName: bluebird`. Istio resolves gateway TLS
# secrets only from the gateway workload's own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bluebird
spec:
  secretName: bluebird
  commonName: bluebirdforecast.com
  dnsNames:
    - bluebirdforecast.com
    - www.bluebirdforecast.com
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
