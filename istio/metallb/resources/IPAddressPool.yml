# Each pool is .100-.199 of its VLAN. Below .100 are the Talos nodes and VIPs, which set
# their own static addresses, and .200-.254 is OPNsense's DHCP range, so MetalLB can never
# hand out an address that a node or a DHCP client already holds.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan40
  namespace: metallb-system
spec:
  addresses:
    - 192.168.40.100-192.168.40.199
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan50
  namespace: metallb-system
spec:
  addresses:
    - 192.168.50.100-192.168.50.199
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan60
  namespace: metallb-system
spec:
  addresses:
    - 192.168.60.100-192.168.60.199
  autoAssign: false
