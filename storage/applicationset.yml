apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage
  namespace: argo-system
  annotations:
    # argocd-diff-preview (pr.yml) renders this set only when a file under
    # storage/ changes, and each app only when a file under its own path does.
    argocd-diff-preview/watch-pattern: "storage/.*"
spec:
  generators:
    - git:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        revision: main
        directories:
          - path: "storage/*"
          - exclude: true
            path: "storage/*.disable*"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      annotations:
        argocd-diff-preview/watch-pattern: "{{ path }}/.*"
      name: "{{ path.basenameNormalized }}"
      labels:
        app-group: storage
    spec:
      project: storage
      source:
        repoURL: https://github.com/zimmertr/Kubernetes-Manifests
        targetRevision: main
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
