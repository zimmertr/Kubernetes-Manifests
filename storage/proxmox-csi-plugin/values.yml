createNamespace: true

storageClass:
  - name: proxmox-flashpool
    storage: FlashPool
    fstype: xfs
    reclaimPolicy: Retain
    cache: "writethrough"
    ssd: true
    mountOptions:
      - noatime
  - name: proxmox-datapool
    storage: DataPool
    fstype: xfs
    reclaimPolicy: Retain
  - name: proxmox-local
    storage: local
    fstype: xfs
    reclaimPolicy: Retain
  # Throwaway space for a Job's ephemeral volume, deleted with its claim:
  # bluebird's planet fill downloads 95 GB here and keeps none of it
  # (bluebird#760).
  - name: proxmox-datapool-scratch
    storage: DataPool
    fstype: xfs
    reclaimPolicy: Delete

# The chart's tolerations, plus the GPU node's taint, so pods there can mount
# Proxmox volumes. Helm replaces lists, so the defaults are repeated.
node:
  tolerations:
    - key: karpenter.sh/disrupted
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: amd.com/gpu
      operator: Exists
      effect: NoSchedule
