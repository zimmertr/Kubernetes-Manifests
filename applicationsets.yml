apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets
  namespace: argo-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zimmertr/Kubernetes-Manifests
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: '**/applicationset.yml'
      exclude: '{deprecated/**,**/*.disabled}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
