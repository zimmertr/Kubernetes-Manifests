apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applicationsets
  namespace: argo-system
  annotations:
    # argocd-diff-preview (pr.yml) renders this only when an ApplicationSet changes.
    argocd-diff-preview/watch-pattern: "(.*/)?applicationset\\.yml"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: root-applications
  source:
    repoURL: https://github.com/zimmertr/Kubernetes-Manifests
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: '**/applicationset.yml'
      exclude: '**/*.disable*'
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
