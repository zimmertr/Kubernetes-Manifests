deploymentStrategy:
  type: Recreate

persistence:
  config:
    enabled: true
    existingClaim: jellyfin-config
  cache:
    enabled: true
    existingClaim: jellyfin-cache
  media:
    enabled: false

service:
  port: 80
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.40.130
  externalTrafficPolicy: Local
  type: LoadBalancer

volumes:  
  - name: jellyfin-anime
    persistentVolumeClaim:
      claimName: jellyfin-anime
  - name: jellyfin-audiobooks
    persistentVolumeClaim:
      claimName: jellyfin-audiobooks
  - name: jellyfin-cartoons
    persistentVolumeClaim:
      claimName: jellyfin-cartoons
  - name: jellyfin-movies
    persistentVolumeClaim:
      claimName: jellyfin-movies
  - name: jellyfin-music
    persistentVolumeClaim:
      claimName: jellyfin-music
  - name: jellyfin-tv-shows
    persistentVolumeClaim:
      claimName: jellyfin-tv-shows
  - name: jellyfin-unsorted
    persistentVolumeClaim:
      claimName: jellyfin-unsorted

volumeMounts:
  - name: jellyfin-anime
    mountPath: /anime
  - name: jellyfin-audiobooks
    mountPath: /audiobooks
  - name: jellyfin-cartoons
    mountPath: /cartoons
  - name: jellyfin-movies
    mountPath: /movies
  - name: jellyfin-music
    mountPath: /music
  - name: jellyfin-tv-shows
    mountPath: /tv_shows
  - name: jellyfin-unsorted
    mountPath: /unsorted